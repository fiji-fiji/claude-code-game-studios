<script>
'use strict';
// Trackmanus: a time trial down a clifftop road. The 3D world is drawn with three.js into an
// off-screen canvas and copied onto #game each frame, with the HUD drawn over it in 2D.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
let lobbyOpen = false;
addEventListener('keydown', e => {

  if (!audio || sndOff) return;

  try {
    const t = audio.ac.currentTime, live = scene === 'play' || scene === 'results';
    const sp = Math.abs(car.vf), k = Math.min(1, sp / tune.topSpeed);
    const gear = Math.min(4, Math.floor(k * 5 * 0.999)), within = k * 5 - gear;

    snd.wf.frequency.setTargetAtTime(300 + k * 1000, t, 0.1);

addEventListener('tune', () => { setMuted(muted); medalTimes(); }); // the tweak panel, when added, moved a value

// ---- Small maths ------------------------------------------------------------------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function h2(ix, iz) {

function noise(x, z) { // smooth value noise, -1 to 1

  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);

// ---- The track: pieces laid end to end, sampled every 2 m --------------------------------
//<track>
// The tracks are in tracks.js. A piece is ['s', length m, height change m] or ['a', radius m,
// angle deg (+ turns right), height change m, bank deg]. x runs east, z runs south (towards the
// sea), y is up.
const TRACKS = window.TRACKS;
const HW = CONFIG.roadHalfWidth.value, DS = 2;
const START_S = 14, ARCH_S = 26;

}

//</track>
